    .palette {

      max-width: 540px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: var(--panel-shadow);
      overflow: hidden;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background 200ms ease, border-color 200ms ease, box-shadow 200ms ease;

      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 15px;
      border-bottom: 1px solid var(--divider);
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .avatar-wrap {

      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 999px;
      object-fit: cover;
      border: 1.5px solid var(--panel-border);
      display: block;
      background: var(--icon-bg);
    }
    .online-dot {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: #22c55e;
      border: 2px solid var(--panel-bg);
    }
    .name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .name {
      font-size: 15.5px;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .domain-tag {

      font-size: 10.5px;
      color: var(--text-muted);
      background: var(--icon-bg);
      border: 1px solid var(--icon-border);
      padding: 1px 6px;
      border-radius: 5px;
    }
    .bio {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .widgets {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

      flex-direction: column;
      align-items: flex-end;

      font-weight: 600;
      color: var(--text-primary);

    .clock-loc {

      color: var(--text-muted);

    .theme-btn {

      height: 34px;
      border-radius: 9px;
      background: var(--icon-bg);
      border: 1px solid var(--icon-border);
      color: var(--text-secondary);

      align-items: center;
      justify-content: center;

      flex-direction: column;
      gap: 3px;

      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-primary);

    .item-text {

      flex-direction: column;
      min-width: 0;

    .item-title {

      font-weight: 550;

    .item-sub {

      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 10px;
      color: var(--text-secondary);
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      border-radius: 5px;
      padding: 2px 6px;
      line-height: 1.3;
    }
    .arrow-icon {
      color: var(--text-muted);
      transition: transform 140ms ease, color 140ms ease;
    }
    .item:hover .arrow-icon, .item.selected .arrow-icon {
      color: var(--text-primary);
      transform: translate(1.5px, -1.5px);
    }

    .copied-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--pill-fg);
      border: 1px solid var(--pill-border);
      display: none;
    }
    .copied-pill.show { display: inline-block; }

    .empty-state {
      display: none;
      padding: 28px 12px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;

    /* Footer */
    .footer {

      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border-top: 1px solid var(--divider);
      background: var(--foot-bg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 10.5px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 8px;
    }
    .foot-hints { display: flex; align-items: center; gap: 10px; }
    .hint { display: inline-flex; align-items: center; gap: 4px; }

    @media (max-width: 520px) {
      body { padding: 16px 12px; align-items: flex-start; }
      .clock-widget, .kbd-hide-mobile, .foot-hints { display: none; }
    }
  </style>

      document.getElementById('name').textContent = p.name;
      document.getElementById('domain-tag').textContent = p.domain;
      document.getElementById('footer-domain').textContent = p.domain;
      document.getElementById('bio').textContent = p.bio;
      document.getElementById('avatar').src = p.avatar;
      document.getElementById('clock-loc').textContent = p.locationLabel || 'SEOUL · KST';
      startClock(p.timezone);

      listEl.innerHTML = '';
      let first = true;

      data.groups.forEach((group) => {
        const gl = document.createElement('div');
        gl.className = 'group-label';
        gl.dataset.group = group.id;
        gl.innerHTML = `<span>${group.label}</span><span>${String(group.items.length).padStart(2, '0')}</span>`;
        listEl.appendChild(gl);

        group.items.forEach((item) => {
          const isCopy = Boolean(item.copy);
          const el = document.createElement(isCopy ? 'div' : 'a');
          el.className = 'item' + (first ? ' selected' : '');
          first = false;
          el.dataset.group = group.id;
          if (item.shortcut) el.dataset.shortcut = item.shortcut.toLowerCase();
          el.dataset.terms = [item.title, item.subtitle, ...(item.keywords || [])].join(' ').toLowerCase();

          if (!isCopy) {
            el.href = item.url;
            el.target = '_blank';
            el.rel = 'noopener noreferrer';
          }

          const iconStyle = item.accent ? ` style="color:${item.accent}"` : '';
          const iconSvg = ICONS[item.icon] || ICONS.link;
          const kbdHtml = item.shortcut ? `<span class="kbd kbd-hide-mobile">${item.shortcut}</span>` : '';
          const pillHtml = isCopy ? `<span class="copied-pill">Copied ✓</span>` : '';
          const rightIcon = isCopy ? ICONS.copy : ICONS.arrow;

          el.innerHTML = `
            <span class="item-left">
              <span class="icon-box"${iconStyle}>${iconSvg}</span>
              <span class="item-text">
                <span class="item-title">${item.title}</span>
                <span class="item-sub">${item.subtitle}</span>
              </span>
            </span>
            <span class="item-right">
              ${pillHtml}
              ${kbdHtml}
              ${rightIcon}
            </span>
          `;

          if (isCopy) {
            el.addEventListener('click', () => {
              if (navigator.clipboard) navigator.clipboard.writeText(item.copy).catch(() => {});
              const pill = el.querySelector('.copied-pill');
              pill.classList.add('show');
              setTimeout(() => pill.classList.remove('show'), 1400);
            });
          }

          listEl.appendChild(el);
        });
      });

      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.id = 'empty';
      empty.textContent = 'No matching links found.';
      listEl.appendChild(empty);

      wireInteractions();
    }

    function wireInteractions() {
      const items = Array.from(listEl.querySelectorAll('.item'));
      const groups = Array.from(listEl.querySelectorAll('.group-label'));
      const empty = document.getElementById('empty');

      const visibleItems = () => items.filter((el) => el.style.display !== 'none');
      const setSelected = (target) => {
        items.forEach((el) => el.classList.remove('selected'));
        if (target) target.classList.add('selected');
      };

      items.forEach((el) => el.addEventListener('mouseenter', () => setSelected(el)));

      search.addEventListener('input', () => {
        const q = search.value.trim().toLowerCase();
        const visibleGroups = new Set();
        items.forEach((el) => {
          const match = !q || el.dataset.terms.includes(q);
          el.style.display = match ? 'flex' : 'none';
          if (match) visibleGroups.add(el.dataset.group);
        });
        groups.forEach((g) => {
          g.style.display = visibleGroups.has(g.dataset.group) ? 'flex' : 'none';
        });
        const vis = visibleItems();
        empty.style.display = vis.length === 0 ? 'block' : 'none';
        setSelected(vis[0]);
      });

      document.addEventListener('keydown', (e) => {
        const typing = document.activeElement === search;
        if (e.key === '/' && !typing) {
          e.preventDefault();
          search.focus();
          return;
        }
        if (e.key === 'Escape' && typing) {
          search.value = '';
          search.dispatchEvent(new Event('input'));
          search.blur();
          return;
        }
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const vis = visibleItems();
          if (!vis.length) return;
          const cur = vis.findIndex((el) => el.classList.contains('selected'));
          const next = e.key === 'ArrowDown'
            ? (cur + 1) % vis.length
            : (cur - 1 + vis.length) % vis.length;
          setSelected(vis[next]);
          return;
        }
        if (e.key === 'Enter') {
          const active = listEl.querySelector('.item.selected');
          if (active) active.click();
          return;
        }
        if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
          const k = e.key.toLowerCase();
          if (k === 't') { toggleTheme(); return; }
          const target = items.find((el) => el.dataset.shortcut === k);
          if (target) target.click();
        }
      });
    }

    fetch('./links.json')
      .then((res) => (res.ok ? res.json() : FALLBACK))
      .then(render)
      .catch(() => render(FALLBACK));
  </script>
</body>
</html>
